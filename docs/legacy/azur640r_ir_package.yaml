# Historical reference only: the legacy IR-blaster-based Azur 640R control
# scheme (helpers + scripts + a `universal` media_player driving
# remote.smart_ir), superseded by custom_components/azur640r. Removed from
# the live Home Assistant config's packages/ directory.

input_boolean:
  azur_power:
    name: Azur Power
  azur_muted:
    name: Azur Muted

input_select:
  azur_source:
    name: Azur Source
    options:
      - DVD
      - CD
      - AUX
      - TUNER
      - VIDEO1
      - VIDEO2

  azur_sound_mode:
    name: Azur Sound Mode
    options:
      - Stereo
      - PLIIx / NEO / DSP
      - DD EX / DTS ES
      - Stereo / Mono

input_number:
  azur_volume:
    name: Azur Volume
    min: 0
    max: 100
    step: 1

script:
  azur_power_toggle:
    alias: Azur Power Toggle
    sequence:
      - service: remote.send_command
        target:
          entity_id: remote.smart_ir
        data:
          command: raw:1776,1776,892,892,1776,892,892,892,892,892,892,892,892,892,892,1776,1776,1776,1776
      - delay: "00:00:00.05"
      - service: remote.send_command
        target:
          entity_id: remote.smart_ir
        data:
          command: raw:1776,1776,892,892,1776,892,892,892,892,892,892,892,892,892,892,1776,1776,1776,1776
      - service: input_boolean.toggle
        target:
          entity_id: input_boolean.azur_power
  azur_power_on:
    alias: Azur - Power On
    sequence:
      - service: remote.send_command
        target:
          entity_id: remote.smart_ir
        data:
          command: rc5:addr=0x10,cmd=0x64
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.azur_power

  azur_power_off:
    alias: Azur - Power Off
    sequence:
      - service: remote.send_command
        target:
          entity_id: remote.smart_ir
        data:
          command: rc5:addr=0x10,cmd=0x65
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.azur_power

  azur_volume_up:
    alias: Azur Volume Up
    sequence:
      - service: remote.send_command
        target:
          entity_id: remote.smart_ir
        data:
          command: raw:1790,888,888,1790,1790,888,888,888,888,888,888,888,888,888,888,1790,888,888,1790,888,888,22349,1790,888,888,1790,1790,888,888,888,888,888,888,888,888,888,888,1790,888,888,1790,888,888
      - delay: "00:00:00.03"
      - service: input_number.increment
        target:
          entity_id: input_number.azur_volume

  azur_volume_down:
    alias: Azur Volume Down
    sequence:
      - service: remote.send_command
        target:
          entity_id: remote.smart_ir
        data:
          command: raw:1760,893,893,1760,1760,893,893,893,893,893,893,893,893,893,893,1760,893,893,1760,1760,893
      - delay: "00:00:00.03"
      - service: input_number.decrement
        target:
          entity_id: input_number.azur_volume

  azur_mute:
    alias: Azur Mute
    sequence:
      - service: remote.send_command
        target:
          entity_id: remote.smart_ir
        data:
          command: raw:1764,889,889,1764,1764,889,889,889,889,889,889,889,889,889,889,1764,1764,1764,889,889,889
