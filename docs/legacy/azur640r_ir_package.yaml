media_player:
  - platform: universal
    name: "Azur 640R"
    unique_id: azur_640r
    device_class: receiver

    state_template: >
      {% if is_state('input_boolean.azur_power', 'on') %}
        on
      {% else %}
        off
      {% endif %}

    children:
      - input_number.azur_volume

    commands:
      turn_on:
        service: script.azur_power_on

      turn_off:
        service: script.azur_power_off

      volume_up:
        service: script.azur_volume_up

      volume_down:
        service: script.azur_volume_down

      select_source:
        service: script.azur_set_source
        data:
          source: "{{ source }}"

    attributes:
      source: input_select.azur_source
      source_list: input_select.azur_source
      sound_mode: input_select.azur_sound_mode
      sound_mode_list: input_select.azur_sound_mode
